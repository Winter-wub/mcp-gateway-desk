[package]
name = "mcp-gateway-desk"
version = "0.1.0"
edition = "2021"
description = "Manage MCP servers and connect AI apps, with direct access to local folders"
license = "MIT"
repository = "https://github.com/winter-wub/mcp-gateway-desk"
readme = "README.md"

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rfd = "0.17"
md5 = "0.7"
tray-icon = "0.24"
tao = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1
