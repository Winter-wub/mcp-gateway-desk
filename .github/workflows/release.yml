name: Release

# Push a tag like v0.2.0 to publish: builds a universal (Apple Silicon + Intel) app,
# makes the .dmg, creates the GitHub release and updates the Homebrew cask in Casks/.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CRATE"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build app and .dmg
        run: ./scripts/bundle.sh --universal "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/MCP-Gateway-Desk-$VERSION.dmg" \
            "dist/MCP-Gateway-Desk-$VERSION.dmg.sha256" \
            --title "MCP Gateway Desk $VERSION" \
            --generate-notes

      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(cut -d' ' -f1 "dist/MCP-Gateway-Desk-$VERSION.dmg.sha256")"
          ./scripts/update-cask.sh "$VERSION" "$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mcp-gateway-desk.rb
          git commit -m "Cask: mcp-gateway-desk $VERSION"
          git push origin HEAD:main
